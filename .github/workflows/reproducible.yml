name: reproducible

on:
  workflow_dispatch:
  push:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - run: uname -a && clang++ --version
      - run: clang++ -std=c++17 -Wall -Wextra -Iinclude tests/test_reproducible.cpp -o repro && ./repro
